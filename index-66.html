nav .side{display:none}nav .d{display:none}
main{flex:1;padding:16px 16px calc(104px + env(safe-area-inset-bottom,0px));max-width:960px;width:100%;margin:0 auto}
@media(min-width:800px){nav{position:sticky;top:0;height:100vh;width:220px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:16px 10px}nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;min-height:46px;padding:10px 12px;font-size:14px}nav .side{display:block}nav .d{display:flex}nav .m{display:none}main{padding:24px}.hm{display:none}}
.logo{font-weight:800;letter-spacing:.06em;color:var(--ac);display:flex;gap:8px;align-items:center;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.t-pr{--t:var(--pl);--a:var(--ac)}.t-ph{--t:var(--phl);--a:var(--ph)}.t-ch{--t:var(--chl);--a:var(--ch)}.t-ma{--t:var(--mal);--a:var(--ma)}.t-or{--t:var(--orl);--a:var(--or)}.t-pk{--t:var(--pkl);--a:var(--pk)}
.tn{background:var(--t);border-color:transparent}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2) 55%,var(--h3));border-radius:24px;padding:18px;margin-bottom:12px;border:1px solid var(--bd)}
.qt{font-size:20px;line-height:1.35;font-weight:700;margin:6px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:800px){.grid{grid-template-columns:repeat(5,1fr)}}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}.g3 .card{padding:10px!important;overflow:hidden}.g3 .card>b{font-size:12.5px;overflow-wrap:anywhere;display:block}
.st{background:var(--t,var(--card));border-radius:16px;padding:11px}.st b{display:block;font-size:20px;font-weight:800;color:var(--a,var(--tx))}.st span,.mu{color:var(--mu);font-size:12px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.qa button{border:0;border-radius:16px;padding:13px 6px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;background:var(--t);color:var(--a);transition:transform .1s}.qa button:active{transform:scale(.96)}
h1{font-size:22px;margin:0;font-weight:800}h2{font-size:15px;margin:0 0 8px;font-weight:700}
.b{display:inline-flex;align-items:center;justify-content:center;min-height:44px;text-decoration:none;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer;transition:transform .1s}.b:active{transform:scale(.97)}.b.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{width:100%;min-width:0;min-height:44px;padding:9px 11px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 10px}.f2>*{min-width:0}@media(max-width:340px){.f2{grid-template-columns:1fr}}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;transition:width .4s}
.em{text-align:center;color:var(--mu);padding:22px 8px}
.tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mu)}
.ib{width:44px;padding:0;font-size:18px}input[type=checkbox]{width:22px;height:22px;min-height:0}.err{color:var(--rd);font-size:13px;margin-top:6px}
.cd{display:flex;gap:14px;margin-top:6px}.cd b{font-size:24px;font-weight:800;display:block}
dialog{padding:0;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);width:calc(100% - 24px);max-width:720px;max-height:90dvh;max-height:90vh;margin:auto;overflow:hidden}
@supports(height:1dvh){dialog{max-height:90dvh}}
dialog[open]{display:flex;flex-direction:column}dialog form{display:flex;flex-direction:column;min-height:0;flex:1;margin:0}dialog::backdrop{background:#0f172a66}
.dh{padding:16px 18px 10px;border-bottom:1px solid var(--bd);flex:none}.dh h2{margin:0;font-size:18px}
.mb{padding:4px 18px 14px;overflow-y:auto;flex:1;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.df{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);flex:none;background:var(--card);flex-wrap:wrap}.df .b{min-width:104px}.df #e{flex:1 0 100%;margin:0 0 2px}
.rs{margin-top:16px;padding:14px;border-radius:16px;background:var(--pl);border:1px solid var(--bd)}.rs .rh{display:flex;flex-direction:column;margin-bottom:2px}.rs .rh b{font-size:16px}
.sg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px}@media(max-width:340px){.sg{grid-template-columns:1fr}}
.sp label{color:var(--ph)}.sp input{border-color:var(--ph);background:var(--phl)}.sc label{color:var(--ch)}.sc input{border-color:var(--ch);background:var(--chl)}.sm label{color:var(--ma)}.sm input{border-color:var(--ma);background:var(--mal)}
.calc{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;background:var(--card);border:1px dashed var(--bd);border-radius:14px;padding:10px;margin-top:12px}.calc b{display:block;font-size:18px;font-weight:800}
.mb{outline:none}input[type=date],input[type=time]{font-size:15px;padding-right:6px}.tr{display:flex;gap:12px;align-items:center;min-height:52px;margin:0;padding:6px 0;border-top:1px solid var(--bd);font-size:14px;color:var(--tx);cursor:pointer}.tr input{width:26px;height:26px;min-height:0;flex:none}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.fi{animation:fi .45s ease}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.noanim *{transition:none!important;animation:none!important}

const QC={"JP": ["Every solved problem is a mark you no longer have to hope for.", "JEE rewards clear concepts, steady practice and calm decisions.", "Revise the mistakes you made, and the paper will repeat fewer of them.", "A mock test is a rehearsal, not a verdict.", "Accuracy first; speed is what accuracy becomes with practice.", "Know your weak chapters by name, then fix them one by one.", "Read the question twice and you will answer it once.", "Strong fundamentals make hard problems feel familiar.", "Treat every test as data about how to prepare better.", "The syllabus is finite; steady days are enough to finish it."], "DI": ["Discipline is doing the plan even on the days you do not feel like it.", "Your future rank is shaped by ordinary hours spent well.", "Start the session first; motivation usually arrives after.", "Decide the day's targets tonight, so tomorrow needs no debate.", "A small rule you keep is worth more than a big promise you break.", "Phone away, timer on, begin.", "Discipline is a kindness to your future self.", "Do the hardest topic when your mind is freshest.", "Keep promises to yourself the way you keep them to others.", "Habits decide on the days when willpower is low."], "CO": ["Consistency turns average days into an exceptional year.", "Two focused hours every day beat twelve hours once a month.", "Do not break the chain; shrink the task, not the habit.", "Progress hides in repetition until it suddenly shows.", "Show up today; that is the whole strategy.", "A steady pace finishes the race that sprinting never does.", "Small daily gains are quiet, and they add up loud.", "The best study plan is the one you can repeat tomorrow.", "Missed a day? Resume with the next hour, not with guilt.", "Regular revision keeps old chapters from becoming new problems."], "FO": ["Focus is saying no to ten good things so one important thing gets done.", "One problem, full attention, then the next.", "Deep work begins when the notifications end.", "A calm desk and a clear goal beat a long, distracted session.", "Where attention goes, learning follows.", "Single-task your way through the syllabus.", "Set a timer, choose one chapter, and stay with it.", "A distracted hour counts for less than a focused twenty minutes.", "Close the extra tabs; open the problem.", "Your attention is your most valuable study resource."], "HW": ["Hard work is making the effort even when the results are not visible yet.", "Effort you put in today is already working for your exam day.", "Difficult chapters become easy because someone kept practising.", "There is no shortcut around solving problems yourself.", "Work hard in private, and let the result speak.", "Sweat in practice so the paper feels lighter.", "Every hour of honest effort leaves you better than before.", "Talent opens the door; effort walks you through it.", "The pages you finish today are the confidence you carry tomorrow.", "Great preparation looks boring from the outside and powerful on result day."], "FA": ["A low score is information, not identity.", "Failing a test teaches what passing never reveals.", "Review the wrong answers; they are the most useful part of the paper.", "Setbacks are part of the path, not a detour from it.", "You have not failed until you stop learning from it.", "Bad test today, better plan tomorrow.", "Mistakes are the cheapest teachers you will ever have.", "Fall, analyse, adjust, continue.", "One poor result cannot erase months of honest work.", "Every strong student has a pile of mistakes behind them."], "IM": ["Aim to be a little better than your last test.", "Improvement is measured against yesterday, not against others.", "Track it, fix it, test it again.", "Fix one weak chapter this week, and your total will notice.", "Small corrections in method create big changes in marks.", "Reduce one type of mistake at a time.", "What you measure, you can improve.", "Growth is slow in the moment and obvious in hindsight.", "Learn from each test, then raise the bar a little.", "Better preparation is built from better reviews."], "CF": ["Confidence comes from preparation, so prepare honestly.", "You have solved hard problems before; you can solve this one.", "Trust the work you have already done.", "Believe in your process, and adjust it with evidence.", "Walk into the exam as someone who has practised for it.", "Calm is a skill, and it improves with every mock test.", "Self-belief grows each time you keep a promise to study.", "You do not need to be perfect, only prepared.", "Start with the questions you know; momentum builds belief.", "Your effort is real, and so is your progress."], "PA": ["Patience is understanding that mastery takes more than one attempt.", "Some concepts need three readings and a good night's sleep.", "Be patient with the chapter and kind to yourself.", "Results arrive on their own schedule; your work arrives on yours.", "Slow understanding is still understanding.", "Rushing the basics costs time later.", "Great things are built in long, quiet stretches.", "Wait for the concept to click; keep working while you wait.", "Growth rarely follows a straight line, and that is fine.", "Give the preparation time to compound."], "ST": ["Understand it, write it down, practise it, revise it.", "Teach a concept aloud, and you will find what you missed.", "Active recall beats rereading every time.", "Study the question types, not just the chapter titles.", "Short, frequent revisions keep formulas alive.", "Solve before you look at the solution.", "Make notes you would be happy to read the night before the exam.", "A formula you can derive is a formula you will not forget.", "Mix subjects in a week so no area goes cold.", "End each session by writing what you learned."], "RL": ["Rest, food and sleep are part of the study plan.", "Your worth is bigger than any single exam.", "Talk to someone when the pressure feels heavy.", "Take a walk; the problem will still be there, and so will you.", "Balance keeps you going longer than panic does.", "Compare your effort with your own plan, not with the toppers online.", "Real life continues beyond results, so look after yourself.", "Good friends and good sleep help good marks.", "Celebrate small wins; they keep you moving.", "Preparation is a phase of your life, not all of it."]};const CATS={"JP": "JEE Preparation", "DI": "Discipline", "CO": "Consistency", "FO": "Focus", "HW": "Hard Work", "FA": "Failure", "IM": "Improvement", "CF": "Confidence", "PA": "Patience", "ST": "Study", "RL": "Real Life"};const QL=[];for(let i=0;i<10;i++)for(const k in QC)QL.push({id:QL.length+1,text:QC[k][i],category:CATS[k],author:''});

function chSave(id){const g=k=>$('#c_'+k).value,E=m=>{$('#e').textContent=m;beep(180)};const name=g('name').trim();if(!name)return E('Chapter name cannot be empty.');let pct=Math.round(n(g('pct')));if(pct<0||pct>100)return E('Completion must be between 0 and 100.');const st=g('st');if(['Completed','Revised','Strong'].includes(st))pct=100;if(st==='Not Started')pct=0;if(st==='Studying'&&(pct<1||pct>99))return E('Studying needs a completion between 1 and 99%.');if(g('start')&&g('target')&&g('target')<g('start'))return E('Target date cannot be before the start date.');

const AFD={rng:'all',from:'',to:'',test:'all',sub:'all',met:'percentage'};let AF={...AFD},cOn=false,cid='';
function afil(){let d=done();if(AF.from)d=d.filter(t=>t.date>=AF.from);if(AF.to)d=d.filter(t=>t.date<=AF.to);if(AF.rng!=='all')d=d.slice(-AF.rng);if(AF.test!=='all')d=d.filter(t=>t.id===AF.test);return d}
function lc(series,d,unit=''){const W=640,H=230,P=36,N=d.length,all=series.flatMap(s=>s.v).filter(v=>v!=null);if(N<2||all.length<2)return '<div class="mu" style="padding:10px 0">Not enough completed tests in this filter to draw a trend (at least two are needed).</div>';
let mx=Math.max(...all),mn=Math.min(...all);if(mx===mn){mx+=1;mn-=1}const x=i=>P+i*(W-2*P)/(N-1),y=v=>H-P-(v-mn)/(mx-mn)*(H-2*P),st=Math.ceil(N/10);
const grid=[0,.5,1].map(f=>{const v=mn+(mx-mn)*f;return `<line x1="${P}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="2" y="${y(v)+4}" font-size="11" fill="var(--mu)">${f1(v)}</text>`}).join('');
const lines=series.map(s=>{const pts=s.v.map((v,i)=>v==null?null:[x(i),y(v),v,i]).filter(Boolean);return `<polyline fill="none" stroke="${s.c}" stroke-width="2.5" points="${pts.map(q=>q[0]+','+q[1]).join(' ')}"/>`+pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="${s.c}"><title>${esc(s.n)} · #${q[3]+1} ${esc(d[q[3]].name)} (${d[q[3]].date}): ${f1(q[2])}${unit}</title></circle>`).join('')+(series.length===1&&N<=8?pts.map(q=>`<text x="${q[0]}" y="${q[1]-9}" text-anchor="middle" font-size="11" fill="currentColor">${f1(q[2])}</text>`).join(''):'')}).join('');
const xl=d.map((t,i)=>i%st?'':`<text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--mu)">#${i+1}</text>`).join('');
return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Trend chart">${grid}${lines}${xl}</svg>`+(series.length>1?`<div class="mu" style="display:flex;gap:12px;flex-wrap:wrap">${series.map(s=>`<span><b style="color:${s.c}">●</b> ${s.n}</span>`).join('')}</div>`:'')}
function qbars(d){d=d.slice(-12);if(!d.length)return '';const W=640,bh=22,g=8,H=d.length*(bh+g)+6,bw=W-50;return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Correct, wrong and unattempted questions per test">`+d.map((t,i)=>{const tq=t.tq||1,c=t.correct||0,w=wrongN(t),u=unN(t),s=v=>v/tq*bw,yy=i*(bh+g)+3;return `<text x="0" y="${yy+15}" font-size="12" fill="var(--mu)">#${i+1}</text><rect x="36" y="${yy}" width="${s(c)}" height="${bh}" fill="var(--ok)"><title>${esc(t.name)}: ${c} correct</title></rect><rect x="${36+s(c)}" y="${yy}" width="${s(w)}" height="${bh}" fill="var(--rd)"><title>${esc(t.name)}: ${w} wrong</title></rect><rect x="${36+s(c)+s(w)}" y="${yy}" width="${s(u)}" height="${bh}" fill="var(--bd)"><title>${esc(t.name)}: ${u} unattempted</title></rect>`}).join('')+`</svg><div class="mu"><b style="color:var(--ok)">●</b> Correct <b style="color:var(--rd)">●</b> Wrong <b style="color:var(--mu)">●</b> Unattempted</div>`}
const so=(v,o)=>o.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(v)?'selected':''}>${esc(b)}</option>`).join('');
const mean=a=>{a=a.filter(v=>v!=null&&!isNaN(v));return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
function analytics(){const all=done(),d=afil(),L=d.at(-1),P=d.at(-2),key=`<div class="mu" style="margin-top:6px">${d.slice(-12).map((t,i,a)=>`#${d.length-a.length+i+1} ${esc(t.name)} (${t.date})`).join(' · ')}</div>`;
const M={marks:t=>t.scored,percentage:pctX,accuracy:accX,'attempt rate':rateX};
const flt=`<div class="card"><h2>Filters</h2><div class="f2"><div><label>Range</label><select onchange="AF.rng=this.value;render()">${so(AF.rng,[['all','All tests'],['5','Last 5 tests'],['10','Last 10 tests']])}</select></div><div><label>Test</label><select onchange="AF.test=this.value;render()">${so(AF.test,[['all','All tests'],...all.map(t=>[t.id,t.name+' · '+t.date])])}</select></div><div><label>From</label><input type="date" value="${AF.from}" onchange="AF.from=this.value;render()"></div><div><label>To</label><input type="date" value="${AF.to}" onchange="AF.to=this.value;render()"></div><div><label>Subject</label><select onchange="AF.sub=this.value;render()">${so(AF.sub,[['all','All subjects'],['p','Physics'],['c','Chemistry'],['m','Mathematics']])}</select></div><div style="align-self:end"><button class="b g" style="width:100%" onclick="AF={...AFD};render()">Reset filters</button></div></div></div>`;

const pts=d.map(M[AF.met]);h+=`<div class="card"><div class="row"><h2>Test improvement curve</h2><select style="width:auto" aria-label="Metric" onchange="AF.met=this.value;render()">${so(AF.met,Object.keys(M).map(k=>[k,k]))}</select></div>${lc([{n:AF.met,c:'var(--ac)',v:pts}],d,AF.met==='marks'?'':'%')}${d.length>1?`<div class="mu">Latest ${fp2(pts.at(-1),AF.met)} · Change vs previous ${pts.at(-1)!=null&&pts.at(-2)!=null?(pts.at(-1)-pts.at(-2)>=0?'+':'')+f1(pts.at(-1)-pts.at(-2)):'N/A'} · Trend ${pts.at(-1)!=null&&pts[0]!=null?(pts.at(-1)>pts[0]?'upward':pts.at(-1)<pts[0]?'downward':'flat'):'N/A'}</div>`:''}${key}</div>`;
h+=`<div class="card"><h2>Subject comparison (% of an equal one-third share)</h2>${lc(sub.map(s=>({n:s[0],c:s[2],v:d.map(t=>spX(t,s[1]))})),d,'%')}${sub.length===1&&d.length===1?`<div class="mu">${sub[0][0]}: ${fp(spX(L,sub[0][1]))} (${f1(L[sub[0][1]])} marks)</div>`:''}</div>`;

h+=`<div class="card"><h2>Latest vs previous tests</h2>`+(P?(()=>{const rc=d.slice(-4,-1),rows=[['Score %',pctX,fp],['Accuracy',accX,fp],['Attempt rate',rateX,fp],['Negative marks',negN,v=>v==null?'N/A':f1(v)]];return `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><tr class="mu"><td></td><td><b>Latest</b></td><td><b>Previous</b></td><td><b>Recent avg</b></td></tr>${rows.map(([l,f,fm])=>`<tr style="border-top:1px solid var(--bd)"><td style="padding:6px 0">${l}</td><td>${fm(f(L))}</td><td>${fm(f(P))}</td><td>${fm(mean(rc.map(f)))}</td></tr>`).join('')}</table></div>`})():'<div class="mu">At least two completed tests are needed for a comparison.</div>')+`</div>`;
