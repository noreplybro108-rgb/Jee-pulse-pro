<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#faf8f5;--card:#fff;--tx:#1f2937;--mu:#6b7280;--bd:#ece8e1;--ac:#5B5FEF;--pl:#EEF0FF;--ph:#3B82F6;--phl:#EAF3FF;--ch:#22C55E;--chl:#EAFBF0;--ma:#8B5CF6;--mal:#F1ECFF;--or:#F59E0B;--orl:#FFF7E6;--pk:#EC4899;--pkl:#FCECF5;--ok:#16A34A;--am:#F59E0B;--rd:#EF4444;--h1:#EEF0FF;--h2:#EAF3FF;--h3:#FCECF5;--sh:0 4px 16px #5b5fef14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b22;--tx:#f3f4f6;--mu:#9ca3af;--bd:#2a2e37;--ac:#6366f1;--pl:#5b5fef26;--phl:#3b82f626;--chl:#22c55e22;--mal:#8b5cf628;--orl:#f59e0b22;--pkl:#ec489924;--h1:#1e2140;--h2:#16263f;--h3:#2d1a33;--sh:none}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b22;--tx:#f3f4f6;--mu:#9ca3af;--bd:#2a2e37;--ac:#6366f1;--pl:#5b5fef26;--phl:#3b82f626;--chl:#22c55e22;--mal:#8b5cf628;--orl:#f59e0b22;--pkl:#ec489924;--h1:#1e2140;--h2:#16263f;--h3:#2d1a33;--sh:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Plus Jakarta Sans",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .3s,color .3s}
#app{display:flex;min-height:100vh}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:4px;z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;border:0;background:none;color:var(--mu);padding:6px 2px;border-radius:14px;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer}
nav button.on{color:var(--ac);background:var(--pl)}
nav .side{display:none}nav .d{display:none}
main{flex:1;padding:16px 16px calc(104px + env(safe-area-inset-bottom,0px));max-width:960px;width:100%;margin:0 auto}
@media(min-width:800px){nav{position:sticky;top:0;height:100vh;width:220px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:16px 10px}nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;min-height:46px;padding:10px 12px;font-size:14px}nav .side{display:block}nav .d{display:flex}nav .m{display:none}main{padding:24px}.hm{display:none}}
.logo{font-weight:800;letter-spacing:.06em;color:var(--ac);display:flex;gap:8px;align-items:center;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.t-pr{--t:var(--pl);--a:var(--ac)}.t-ph{--t:var(--phl);--a:var(--ph)}.t-ch{--t:var(--chl);--a:var(--ch)}.t-ma{--t:var(--mal);--a:var(--ma)}.t-or{--t:var(--orl);--a:var(--or)}.t-pk{--t:var(--pkl);--a:var(--pk)}
.tn{background:var(--t);border-color:transparent}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2) 55%,var(--h3));border-radius:24px;padding:18px;margin-bottom:12px;border:1px solid var(--bd)}
.qt{font-size:20px;line-height:1.35;font-weight:700;margin:6px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:800px){.grid{grid-template-columns:repeat(5,1fr)}}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}.g3 .card{padding:10px!important;overflow:hidden}.g3 .card>b{font-size:12.5px;overflow-wrap:anywhere;display:block}
.st{background:var(--t,var(--card));border-radius:16px;padding:11px}.st b{display:block;font-size:20px;font-weight:800;color:var(--a,var(--tx))}.st span,.mu{color:var(--mu);font-size:12px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.qa button{border:0;border-radius:16px;padding:13px 6px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;background:var(--t);color:var(--a);transition:transform .1s}.qa button:active{transform:scale(.96)}
h1{font-size:22px;margin:0;font-weight:800}h2{font-size:15px;margin:0 0 8px;font-weight:700}
.b{display:inline-flex;align-items:center;justify-content:center;min-height:44px;text-decoration:none;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer;transition:transform .1s}.b:active{transform:scale(.97)}.b.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{width:100%;min-width:0;min-height:44px;padding:9px 11px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 10px}.f2>*{min-width:0}@media(max-width:340px){.f2{grid-template-columns:1fr}}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;transition:width .4s}
.em{text-align:center;color:var(--mu);padding:22px 8px}
.tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mu)}
.ib{width:44px;padding:0;font-size:18px}input[type=checkbox]{width:22px;height:22px;min-height:0}.err{color:var(--rd);font-size:13px;margin-top:6px}
.cd{display:flex;gap:14px;margin-top:6px}.cd b{font-size:24px;font-weight:800;display:block}
dialog{padding:0;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);width:calc(100% - 24px);max-width:720px;max-height:90dvh;max-height:90vh;margin:auto;overflow:hidden}
@supports(height:1dvh){dialog{max-height:90dvh}}
dialog[open]{display:flex;flex-direction:column}dialog form{display:flex;flex-direction:column;min-height:0;flex:1;margin:0}dialog::backdrop{background:#0f172a66}
.dh{padding:16px 18px 10px;border-bottom:1px solid var(--bd);flex:none}.dh h2{margin:0;font-size:18px}
.mb{padding:4px 18px 14px;overflow-y:auto;flex:1;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.df{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);flex:none;background:var(--card);flex-wrap:wrap}.df .b{min-width:104px}.df #e{flex:1 0 100%;margin:0 0 2px}
.rs{margin-top:16px;padding:14px;border-radius:16px;background:var(--pl);border:1px solid var(--bd)}.rs .rh{display:flex;flex-direction:column;margin-bottom:2px}.rs .rh b{font-size:16px}
.sg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px}@media(max-width:340px){.sg{grid-template-columns:1fr}}
.sp label{color:var(--ph)}.sp input{border-color:var(--ph);background:var(--phl)}.sc label{color:var(--ch)}.sc input{border-color:var(--ch);background:var(--chl)}.sm label{color:var(--ma)}.sm input{border-color:var(--ma);background:var(--mal)}
.calc{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;background:var(--card);border:1px dashed var(--bd);border-radius:14px;padding:10px;margin-top:12px}.calc b{display:block;font-size:18px;font-weight:800}
.mb{outline:none}input[type=date],input[type=time]{font-size:15px;padding-right:6px}.tr{display:flex;gap:12px;align-items:center;min-height:52px;margin:0;padding:6px 0;border-top:1px solid var(--bd);font-size:14px;color:var(--tx);cursor:pointer}.tr input{width:26px;height:26px;min-height:0;flex:none}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.fi{animation:fi .45s ease}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.noanim *{transition:none!important;animation:none!important}
</style></head><body>

const QC={"JP": ["Every solved problem is a mark you no longer have to hope for.", "JEE rewards clear concepts, steady practice and calm decisions.", "Revise the mistakes you made, and the paper will repeat fewer of them.", "A mock test is a rehearsal, not a verdict.", "Accuracy first; speed is what accuracy becomes with practice.", "Know your weak chapters by name, then fix them one by one.", "Read the question twice and you will answer it once.", "Strong fundamentals make hard problems feel familiar.", "Treat every test as data about how to prepare better.", "The syllabus is finite; steady days are enough to finish it."], "DI": ["Discipline is doing the plan even on the days you do not feel like it.", "Your future rank is shaped by ordinary hours spent well.", "Start the session first; motivation usually arrives after.", "Decide the day's targets tonight, so tomorrow needs no debate.", "A small rule you keep is worth more than a big promise you break.", "Phone away, timer on, begin.", "Discipline is a kindness to your future self.", "Do the hardest topic when your mind is freshest.", "Keep promises to yourself the way you keep them to others.", "Habits decide on the days when willpower is low."], "CO": ["Consistency turns average days into an exceptional year.", "Two focused hours every day beat twelve hours once a month.", "Do not break the chain; shrink the task, not the habit.", "Progress hides in repetition until it suddenly shows.", "Show up today; that is the whole strategy.", "A steady pace finishes the race that sprinting never does.", "Small daily gains are quiet, and they add up loud.", "The best study plan is the one you can repeat tomorrow.", "Missed a day? Resume with the next hour, not with guilt.", "Regular revision keeps old chapters from becoming new problems."], "FO": ["Focus is saying no to ten good things so one important thing gets done.", "One problem, full attention, then the next.", "Deep work begins when the notifications end.", "A calm desk and a clear goal beat a long, distracted session.", "Where attention goes, learning follows.", "Single-task your way through the syllabus.", "Set a timer, choose one chapter, and stay with it.", "A distracted hour counts for less than a focused twenty minutes.", "Close the extra tabs; open the problem.", "Your attention is your most valuable study resource."], "HW": ["Hard work is making the effort even when the results are not visible yet.", "Effort you put in today is already working for your exam day.", "Difficult chapters become easy because someone kept practising.", "There is no shortcut around solving problems yourself.", "Work hard in private, and let the result speak.", "Sweat in practice so the paper feels lighter.", "Every hour of honest effort leaves you better than before.", "Talent opens the door; effort walks you through it.", "The pages you finish today are the confidence you carry tomorrow.", "Great preparation looks boring from the outside and powerful on result day."], "FA": ["A low score is information, not identity.", "Failing a test teaches what passing never reveals.", "Review the wrong answers; they are the most useful part of the paper.", "Setbacks are part of the path, not a detour from it.", "You have not failed until you stop learning from it.", "Bad test today, better plan tomorrow.", "Mistakes are the cheapest teachers you will ever have.", "Fall, analyse, adjust, continue.", "One poor result cannot erase months of honest work.", "Every strong student has a pile of mistakes behind them."], "IM": ["Aim to be a little better than your last test.", "Improvement is measured against yesterday, not against others.", "Track it, fix it, test it again.", "Fix one weak chapter this week, and your total will notice.", "Small corrections in method create big changes in marks.", "Reduce one type of mistake at a time.", "What you measure, you can improve.", "Growth is slow in the moment and obvious in hindsight.", "Learn from each test, then raise the bar a little.", "Better preparation is built from better reviews."], "CF": ["Confidence comes from preparation, so prepare honestly.", "You have solved hard problems before; you can solve this one.", "Trust the work you have already done.", "Believe in your process, and adjust it with evidence.", "Walk into the exam as someone who has practised for it.", "Calm is a skill, and it improves with every mock test.", "Self-belief grows each time you keep a promise to study.", "You do not need to be perfect, only prepared.", "Start with the questions you know; momentum builds belief.", "Your effort is real, and so is your progress."], "PA": ["Patience is understanding that mastery takes more than one attempt.", "Some concepts need three readings and a good night's sleep.", "Be patient with the chapter and kind to yourself.", "Results arrive on their own schedule; your work arrives on yours.", "Slow understanding is still understanding.", "Rushing the basics costs time later.", "Great things are built in long, quiet stretches.", "Wait for the concept to click; keep working while you wait.", "Growth rarely follows a straight line, and that is fine.", "Give the preparation time to compound."], "ST": ["Understand it, write it down, practise it, revise it.", "Teach a concept aloud, and you will find what you missed.", "Active recall beats rereading every time.", "Study the question types, not just the chapter titles.", "Short, frequent revisions keep formulas alive.", "Solve before you look at the solution.", "Make notes you would be happy to read the night before the exam.", "A formula you can derive is a formula you will not forget.", "Mix subjects in a week so no area goes cold.", "End each session by writing what you learned."], "RL": ["Rest, food and sleep are part of the study plan.", "Your worth is bigger than any single exam.", "Talk to someone when the pressure feels heavy.", "Take a walk; the problem will still be there, and so will you.", "Balance keeps you goin function shrink(f){return new Promise(res=>{if(!f.type.startsWith('image/')||f.type==='image/gif')return res(f);const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);res(b&&b.size<f.size?new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f)},'image/jpeg',.82)};im.onerror=()=>{URL.revokeObjectURL(u);res(f)};im.src=u})}
async function saveFile(f){const ok=/^(image\/(jpeg|png|webp)|application\/pdf|text\/(plain|markdown))$/.test(f.type)||/\.(md|txt)$/i.test(f.name);if(!ok)throw new Error('Unsupported file type. Use PDF, JPG, PNG, WebP, TXT or MD.');if(f.size>15*1048576)throw new Error('File is too large (max 15 MB).');const b=await shrink(f);if(b.size>8*1048576)throw new Error('File is larger than 8 MB.');const id=uid()+uid();await fput(id,b);return{id,name:b.name||f.name,type:b.type||f.type||'text/markdown',size:b.size,date:ymd(new Date())}}
